<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Please Forgive Me</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Pacifico&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ffe6eb 0%, #ffd1dc 50%, #ffc0cb 100%);
      font-family: 'Nunito', sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Floating background hearts */
    .heart-bg {
      position: absolute;
      bottom: -40px;
      color: rgba(255, 105, 135, 0.35);
      font-size: 24px;
      animation: floatUp 8s linear infinite;
      user-select: none;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(0.8) rotate(0deg);
        opacity: 0;
      }
      20% {
        opacity: 0.7;
      }
      80% {
        opacity: 0.7;
      }
      100% {
        transform: translateY(-110vh) scale(1.2) rotate(360deg);
        opacity: 0;
      }
    }

    .container {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(10px);
      padding: 40px 32px;
      border-radius: 28px;
      box-shadow: 0 15px 35px rgba(255, 140, 160, 0.25);
      text-align: center;
      max-width: 480px;
      width: 90%;
      z-index: 10;
      border: 2px solid rgba(255, 255, 255, 0.8);
      transition: all 0.3s ease;
    }

    .sticker {
      font-size: 64px;
      margin-bottom: 12px;
      animation: bounce 2s infinite ease-in-out;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    h1 {
      color: #d81b60;
      font-size: 2rem;
      margin-bottom: 28px;
      line-height: 1.3;
      font-weight: 800;
    }

    .button-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      min-height: 90px;
    }

    .btn {
      padding: 14px 24px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
      touch-action: manipulation;
      transition: transform 0.25s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:active {
      filter: brightness(0.95);
    }

    /* "No I won't" button */
    #noBtn {
      background-color: #fce4ec;
      color: #c2185b;
      transform-origin: center center;
    }

    /* "ok you're forgiven" button */
    #yesBtn {
      background: linear-gradient(135deg, #ff4081, #f50057);
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(245, 0, 87, 0.35);
    }

    #yesBtn:hover {
      transform: scale(1.05);
    }

    /* Success Page Elements */
    .hidden {
      display: none;
    }

    .success-text {
      font-family: 'Pacifico', cursive;
      color: #ad1457;
      font-size: 2.2rem;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <!-- First Page / Screen -->
  <div class="container" id="page1">
    <div class="sticker">🥺👉👈</div>
    <h1>please forgive mee 😭</h1>
    <div class="button-group">
      <button class="btn" id="noBtn">No I won't</button>
      <button class="btn" id="yesBtn">ok you're forgiven</button>
    </div>
  </div>

  <!-- Second Page / Screen -->
  <div class="container hidden" id="page2">
    <div class="sticker">🥰👑💖</div>
    <h1 class="success-text">Thank you my cutie princess</h1>
  </div>

  <script>
    // Floating background hearts generator
    const heartSymbols = ['❤️', '💖', '💕', '🌸', '✨'];
    for (let i = 0; i < 18; i++) {
      const heart = document.createElement('div');
      heart.className = 'heart-bg';
      heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDelay = Math.random() * 6 + 's';
      heart.style.animationDuration = 5 + Math.random() * 6 + 's';
      heart.style.fontSize = 18 + Math.random() * 20 + 'px';
      document.body.appendChild(heart);
    }

    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const page1 = document.getElementById('page1');
    const page2 = document.getElementById('page2');

    let currentScale = 1.0;

    // Shrinks by 0.8x on each click or touch
    function shrinkNoButton(event) {
      event.preventDefault();
      currentScale *= 0.8;
      noBtn.style.transform = `scale(${currentScale})`;

      // If it becomes too small to tap, hide it entirely
      if (currentScale < 0.15) {
        noBtn.style.display = 'none';
      }
    }

    noBtn.addEventListener('click', shrinkNoButton);
    noBtn.addEventListener('touchstart', shrinkNoButton, { passive: false });

    // Transition to the second screen
    yesBtn.addEventListener('click', () => {
      page1.classList.add('hidden');
      page2.classList.remove('hidden');
    });
  </script>
</body>
</html>
